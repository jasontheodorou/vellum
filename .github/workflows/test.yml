name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and ShellCheck
        run: brew install bats-core shellcheck

      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR -S warning bin/vellum test/helpers.bash

      - name: Tests
        run: bats test/

  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the plugin
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
